# Standalone Guestbook SPA.
# From repo root (GHCR default — path B PUBLIC_* baked):
#   cp deploy/guestbook/guestbook.env.example deploy/guestbook/guestbook.env
#   docker compose -f deploy/guestbook/docker-compose.yml --env-file deploy/guestbook/guestbook.env pull
#   docker compose -f deploy/guestbook/docker-compose.yml --env-file deploy/guestbook/guestbook.env up -d
#
# Custom contract/RPC: … up --build -d

services:
  guestbook:
    image: ${GUESTBOOK_IMAGE:-ghcr.io/dewnetwork/dew-guestbook:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ../..
      dockerfile: deploy/guestbook/Dockerfile
      args:
        - PUBLIC_RPC_URL=${PUBLIC_RPC_URL:-https://rpc-dew.fadosoft.com}
        - PUBLIC_GUESTBOOK=${PUBLIC_GUESTBOOK:-0xE9699494Cc8fA6438c1B0c3c6D3dDF64C6cEfc02}
        - PUBLIC_EXPLORER_URL=${PUBLIC_EXPLORER_URL:-https://explorer-dew.fadosoft.com}
        - PUBLIC_CHAIN_ID=${PUBLIC_CHAIN_ID:-2205}
    container_name: dew-guestbook
    ports:
      - "${GUESTBOOK_BIND:-127.0.0.1}:${GUESTBOOK_PORT:-8083}:80"
    restart: unless-stopped
