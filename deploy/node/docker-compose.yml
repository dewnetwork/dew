# Dew controlled public RPC (path B) — single host.
#
# From repo root (pull GHCR by default):
#   cp deploy/node/public.env.example deploy/node/public.env   # once
#   docker compose -f deploy/node/docker-compose.yml --env-file deploy/node/public.env pull
#   docker compose -f deploy/node/docker-compose.yml --env-file deploy/node/public.env up -d
#
# Rebuild from source: … up --build
#
# Layout:
#   - dew: JSON-RPC only on the internal compose network (not published to host)
#   - proxy: nginx on host :80 / :443 → dew:8545 with rate limit + body cap
#
# TLS: mount certs into deploy/node/certs/ (see README) or terminate TLS elsewhere.
# Systemd alternative: deploy/node/public-rpc-single-host.md
#
# Do not use this file for private soak — use docker-compose.soak.yml.

name: dew-public

services:
  dew:
    image: ${DEW_IMAGE:-ghcr.io/dewnetwork/dew:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ../..
      dockerfile: deploy/node/Dockerfile
      args:
        GENESIS_FILE: ${DEW_GENESIS_FILE:-genesis.public.json}
    container_name: dew-rpc
    command:
      - run
      - --genesis
      - /etc/dew/genesis.json
      - --http.addr
      - "0.0.0.0"
      - --http.port
      - "8545"
    volumes:
      - dew-rpc-data:/var/lib/dew
    # No host ports — reachable only via dew_internal (proxy).
    # Port must stay 8545 to match nginx/dew-rpc.docker.conf upstream.
    expose:
      - "8545"
    restart: unless-stopped
    networks:
      - dew_internal

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: dew-rpc-proxy
    depends_on:
      - dew
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/dew-rpc.docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional TLS material (uncomment HTTPS block in dew-rpc.docker.conf):
      # - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - dew_internal
      - dew_edge

networks:
  # No direct host/internet path to Dew; proxy bridges edge ↔ internal.
  dew_internal:
    driver: bridge
    internal: true
  dew_edge:
    driver: bridge

volumes:
  dew-rpc-data:
