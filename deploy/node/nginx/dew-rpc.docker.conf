# nginx for Docker Compose public path B (upstream = service "dew").
# Mounted as /etc/nginx/conf.d/default.conf by deploy/node/docker-compose.yml.
#
# Host/systemd install uses dew-rpc.conf (upstream 127.0.0.1:8545) instead.

limit_req_zone $binary_remote_addr zone=dew_rpc:10m rate=10r/s;

upstream dew_rpc_backend {
    server dew:8545;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # Accept any Host; set your domain in DNS → this host.
    server_name _;

    client_max_body_size 1m;

    location / {
        limit_req zone=dew_rpc burst=20 nodelay;
        limit_req_status 429;

        # JSON-RPC is POST; allow OPTIONS for browser wallets
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://dew_rpc_backend;
    }
}

