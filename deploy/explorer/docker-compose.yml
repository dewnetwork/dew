# Standalone explorer SPA against a browser-reachable JSON-RPC URL.
# From repo root (GHCR default — PUBLIC_* already baked for path B):
#   cp deploy/explorer/explorer.env.example deploy/explorer/explorer.env
#   docker compose -f deploy/explorer/docker-compose.yml --env-file deploy/explorer/explorer.env pull
#   docker compose -f deploy/explorer/docker-compose.yml --env-file deploy/explorer/explorer.env up -d
#
# Custom RPC/base URL requires a source rebuild:
#   docker compose -f deploy/explorer/docker-compose.yml --env-file deploy/explorer/explorer.env up --build -d

services:
  explorer:
    image: ${EXPLORER_IMAGE:-ghcr.io/dewnetwork/dew-explorer:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ../..
      dockerfile: deploy/explorer/Dockerfile
      args:
        - PUBLIC_RPC_URL=${PUBLIC_RPC_URL:-https://rpc-dew.fadosoft.com}
        - PUBLIC_CHAIN_ID=${PUBLIC_CHAIN_ID:-2205}
        - PUBLIC_EXPLORER_BASE=${PUBLIC_EXPLORER_BASE:-https://explorer-dew.fadosoft.com}
        - PUBLIC_INDEXER_URL=${PUBLIC_INDEXER_URL:-https://explorer-dew.fadosoft.com/indexer}
        - PUBLIC_DEW_PRICE_USD=${PUBLIC_DEW_PRICE_USD:-}
        - PUBLIC_DEW_PRICE_BTC=${PUBLIC_DEW_PRICE_BTC:-}
        - PUBLIC_DEW_PRICE_CHANGE_24H=${PUBLIC_DEW_PRICE_CHANGE_24H:-}
        - PUBLIC_DEW_MARKET_CAP_USD=${PUBLIC_DEW_MARKET_CAP_USD:-}
        - PUBLIC_DEW_TOTAL_SUPPLY=${PUBLIC_DEW_TOTAL_SUPPLY:-}
        - PUBLIC_KNOWN_TOKENS=${PUBLIC_KNOWN_TOKENS:-USDT:0x43d08b71B0A5626a9D0eB607C2aE5277255cFbC8,USDC:0xacDd0BF26C96879b4c4CeE8F92928f1760F07119,DAI:0x9813B1738eb2982F3D0C1E22F9C7c4F07B670a1B,WETH:0x5b88b2ab38920197328f9D90BaAf29cb91F7E3CB,WBTC:0xdB6E09cb954Ae645C815Bc941bDfD85D4144166E}
    container_name: dew-explorer
    ports:
      - "${EXPLORER_BIND:-127.0.0.1}:${EXPLORER_PORT:-8082}:80"
    restart: unless-stopped
