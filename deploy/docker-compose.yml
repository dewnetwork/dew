# Combined public stack: Dew + indexer + faucet + explorer + nginx edge (:80/:443) + certbot.
#
# From repo root (pull GHCR release images — default):
#   cp deploy/.env.example deploy/.env   # edit keys / image tags / TLS
#   # TLS (see deploy/README.md):
#   #   DNS-01 CF: CERTBOT_AUTH=dns-cloudflare + CLOUDFLARE_API_TOKEN + CERTBOT_IMAGE=certbot/dns-cloudflare
#   #   HTTP-01:   CERTBOT_AUTH=webroot + CERTBOT_EMAIL
#   #   Origin CA: mount PEMs + CERTBOT_DISABLE=1 (optional; see README)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Rebuild from source instead of GHCR:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build -d
#
# Public hostnames (DNS A/AAAA → this host):
#   https://rpc-dew.fadosoft.com
#   https://faucet-dew.fadosoft.com
#   https://explorer-dew.fadosoft.com          (+ /indexer/ → dewindex P1e)
#   https://guestbook-dew.fadosoft.com
#
# Only the edge service publishes host ports (80/443). Backends stay on dew_network.

name: dew

services:
  # 1. Dew Blockchain Node (public path B — single auto-mine RPC)
  # GHCR image bakes genesis.public.json (faucet alloc only).
  dew-node:
    image: ${DEW_IMAGE:-ghcr.io/dewnetwork/dew:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ..
      dockerfile: deploy/node/Dockerfile
      args:
        GENESIS_FILE: ${DEW_GENESIS_FILE:-genesis.public.json}
    container_name: dew-node
    command:
      - run
      - --genesis
      - /etc/dew/genesis.json
      - --http.addr
      - "0.0.0.0"
      - --http.port
      - "8545"
    volumes:
      - dew-node-data:/var/lib/dew
    # Internal only — JSON-RPC via edge (rpc-dew.fadosoft.com).
    # Debug from host: docker compose exec dew-node … or temporary ports: mapping.
    expose:
      - "8545"
    restart: unless-stopped
    networks:
      - dew_network

  # 1b. History indexer (P1e) — SQLite sidecar; browser via edge /indexer/
  indexer:
    image: ${INDEXER_IMAGE:-ghcr.io/dewnetwork/dew-indexer:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ..
      dockerfile: deploy/indexer/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    container_name: dew-indexer
    command:
      - -rpc
      - http://dew-node:8545
      - -db
      - /var/lib/dewindex/indexer.db
      - -http.addr
      - "0.0.0.0:8550"
    volumes:
      - dew-indexer-data:/var/lib/dewindex
    expose:
      - "8550"
    depends_on:
      - dew-node
    restart: unless-stopped
    networks:
      - dew_network

  # 2. Faucet Go Backend
  faucet-backend:
    image: ${FAUCET_IMAGE:-ghcr.io/dewnetwork/dew-faucet:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ..
      dockerfile: deploy/faucet/Dockerfile
    container_name: dew-faucet-backend
    environment:
      - FAUCET_LISTEN=0.0.0.0:8080
      - FAUCET_RPC_URL=http://dew-node:8545
      - FAUCET_CHAIN_ID=${FAUCET_CHAIN_ID:-2205}
      - FAUCET_PRIVATE_KEY=${FAUCET_PRIVATE_KEY:-ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      - FAUCET_MODE=${FAUCET_MODE:-dev}
      - FAUCET_CAPTCHA_PROVIDER=${FAUCET_CAPTCHA_PROVIDER:-}
      - FAUCET_CAPTCHA_SECRET=${FAUCET_CAPTCHA_SECRET:-}
      - FAUCET_ALLOWLIST=/etc/dew/faucet-allowlist.txt
      - FAUCET_AMOUNT_WEI=${FAUCET_AMOUNT_WEI:-1000000000000000000}
      - FAUCET_LIMIT_ADDRESS=${FAUCET_LIMIT_ADDRESS:-1}
      - FAUCET_LIMIT_ADDRESS_WINDOW=${FAUCET_LIMIT_ADDRESS_WINDOW:-24h}
      - FAUCET_LIMIT_IP=${FAUCET_LIMIT_IP:-10}
      - FAUCET_LIMIT_IP_WINDOW=${FAUCET_LIMIT_IP_WINDOW:-1h}
      - FAUCET_TRUSTED_PROXY=true
      - FAUCET_ALLOW_ANVIL_KEY=${FAUCET_ALLOW_ANVIL_KEY:-true}
    volumes:
      - ${FAUCET_ALLOWLIST_PATH:-../faucet/allowlist.example.txt}:/etc/dew/faucet-allowlist.txt:ro
    depends_on:
      - dew-node
    restart: unless-stopped
    networks:
      - dew_network

  # 3. Faucet React Frontend (internal nginx → backend)
  # GHCR SPA bakes path B PUBLIC_*; --build uses args below for custom hosts.
  faucet-frontend:
    image: ${FAUCET_WEB_IMAGE:-ghcr.io/dewnetwork/dew-faucet-web:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ..
      dockerfile: deploy/faucet/Dockerfile.web
      args:
        - PUBLIC_FAUCET_API_URL=${PUBLIC_FAUCET_API_URL:-/api}
        - PUBLIC_EXPLORER_URL=${PUBLIC_EXPLORER_URL:-https://explorer-dew.fadosoft.com}
        - PUBLIC_CAPTCHA_PROVIDER=${PUBLIC_CAPTCHA_PROVIDER:-}
        - PUBLIC_CAPTCHA_SITE_KEY=${PUBLIC_CAPTCHA_SITE_KEY:-}
    container_name: dew-faucet-frontend
    expose:
      - "80"
    depends_on:
      - faucet-backend
    restart: unless-stopped
    networks:
      - dew_network

  # 4. Block Explorer SPA (browser talks to PUBLIC_RPC_URL + optional PUBLIC_INDEXER_URL)
  explorer:
    image: ${EXPLORER_IMAGE:-ghcr.io/dewnetwork/dew-explorer:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ..
      dockerfile: deploy/explorer/Dockerfile
      args:
        - PUBLIC_RPC_URL=${PUBLIC_RPC_URL:-https://rpc-dew.fadosoft.com}
        - PUBLIC_CHAIN_ID=${PUBLIC_CHAIN_ID:-2205}
        - PUBLIC_EXPLORER_BASE=${PUBLIC_EXPLORER_BASE:-https://explorer-dew.fadosoft.com}
        - PUBLIC_INDEXER_URL=${PUBLIC_INDEXER_URL:-https://explorer-dew.fadosoft.com/indexer}
        - PUBLIC_DEW_PRICE_USD=${PUBLIC_DEW_PRICE_USD:-}
        - PUBLIC_DEW_PRICE_BTC=${PUBLIC_DEW_PRICE_BTC:-}
        - PUBLIC_DEW_PRICE_CHANGE_24H=${PUBLIC_DEW_PRICE_CHANGE_24H:-}
        - PUBLIC_DEW_MARKET_CAP_USD=${PUBLIC_DEW_MARKET_CAP_USD:-}
        - PUBLIC_DEW_TOTAL_SUPPLY=${PUBLIC_DEW_TOTAL_SUPPLY:-}
        - PUBLIC_KNOWN_TOKENS=${PUBLIC_KNOWN_TOKENS:-USDT:0x43d08b71B0A5626a9D0eB607C2aE5277255cFbC8,USDC:0xacDd0BF26C96879b4c4CeE8F92928f1760F07119,DAI:0x9813B1738eb2982F3D0C1E22F9C7c4F07B670a1B,WETH:0x5b88b2ab38920197328f9D90BaAf29cb91F7E3CB,WBTC:0xdB6E09cb954Ae645C815Bc941bDfD85D4144166E}
    container_name: dew-explorer
    expose:
      - "80"
    depends_on:
      - dew-node
      - indexer
    restart: unless-stopped
    networks:
      - dew_network

  # 4b. Guestbook SPA (browser → PUBLIC_RPC_URL + MetaMask)
  guestbook:
    image: ${GUESTBOOK_IMAGE:-ghcr.io/dewnetwork/dew-guestbook:latest}
    pull_policy: ${PULL_POLICY:-always}
    build:
      context: ..
      dockerfile: deploy/guestbook/Dockerfile
      args:
        - PUBLIC_RPC_URL=${PUBLIC_RPC_URL:-https://rpc-dew.fadosoft.com}
        - PUBLIC_GUESTBOOK=${PUBLIC_GUESTBOOK:-0x83bB4E539BE46503481E66094b01b854990BF84a}
        - PUBLIC_EXPLORER_URL=${PUBLIC_EXPLORER_URL:-https://explorer-dew.fadosoft.com}
        - PUBLIC_CHAIN_ID=${PUBLIC_CHAIN_ID:-2205}
    container_name: dew-guestbook
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - dew_network

  # 5. Public edge — only host-published ports (:80 / :443)
  edge:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: dew-edge
    depends_on:
      - dew-node
      - indexer
      - faucet-frontend
      - explorer
      - guestbook
    environment:
      - CERT_PRIMARY=${CERT_PRIMARY:-rpc-dew.fadosoft.com}
      # Optional host PEMs: mount a dir at /etc/nginx/origin-certs (see deploy/README.md)
      - ORIGIN_CERT_DIR=/etc/nginx/origin-certs
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/dew-edge.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/docker-entrypoint-edge.sh:/docker-entrypoint-edge.sh:ro
      - dew_letsencrypt:/etc/letsencrypt:ro
      - dew_certbot_www:/var/www/certbot:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-edge.sh"]
    restart: unless-stopped
    networks:
      - dew_network

  # 6. Certbot — auto-issue (if missing) + renew every 12h
  # CERTBOT_AUTH=webroot | dns-cloudflare  ·  CERTBOT_DISABLE=1 to idle
  # DNS-01: CERTBOT_IMAGE=certbot/dns-cloudflare + CLOUDFLARE_API_TOKEN in .env
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v2.11.0}
    container_name: dew-certbot
    depends_on:
      - edge
    environment:
      - CERTBOT_DISABLE=${CERTBOT_DISABLE:-}
      - CERTBOT_AUTH=${CERTBOT_AUTH:-webroot}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-}
      - CERT_PRIMARY=${CERT_PRIMARY:-rpc-dew.fadosoft.com}
      - RPC_HOST=${RPC_HOST:-rpc-dew.fadosoft.com}
      - FAUCET_HOST=${FAUCET_HOST:-faucet-dew.fadosoft.com}
      - EXPLORER_HOST=${EXPLORER_HOST:-explorer-dew.fadosoft.com}
      - GUESTBOOK_HOST=${GUESTBOOK_HOST:-guestbook-dew.fadosoft.com}
      - CERTBOT_ISSUE_RETRY_SEC=${CERTBOT_ISSUE_RETRY_SEC:-120}
      - CERTBOT_RENEW_INTERVAL_SEC=${CERTBOT_RENEW_INTERVAL_SEC:-43200}
      - CERTBOT_DNS_PROPAGATION_SECONDS=${CERTBOT_DNS_PROPAGATION_SECONDS:-30}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - dew_letsencrypt:/etc/letsencrypt
      - dew_certbot_www:/var/www/certbot
      - ./nginx/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/certbot-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - dew_network

networks:
  dew_network:
    driver: bridge

volumes:
  dew-node-data:
  dew-indexer-data:
  dew_letsencrypt:
  dew_certbot_www:
