# Host nginx edge for public Dew surfaces under *-dew.fadosoft.com
#
# Install:
#   sudo apt-get update && sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo install -m 644 deploy/nginx/dew-edge.conf /etc/nginx/sites-available/dew-edge
#   sudo ln -sf /etc/nginx/sites-available/dew-edge /etc/nginx/sites-enabled/dew-edge
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo bash deploy/scripts/setup-certbot.sh
#
# Backends must listen on loopback only (Compose bind 127.0.0.1, or systemd 127.0.0.1).
# Firewall: allow 22/80/443 only — never publish :8545 / :8081 / :8082 on 0.0.0.0.

limit_req_zone $binary_remote_addr zone=dew_rpc:10m rate=10r/s;

upstream dew_rpc_backend {
    server 127.0.0.1:8545;
    keepalive 32;
}

upstream dew_faucet_backend {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream dew_explorer_backend {
    server 127.0.0.1:8082;
    keepalive 16;
}

# --- JSON-RPC: https://rpc-dew.fadosoft.com ---
server {
    listen 80;
    listen [::]:80;
    server_name rpc-dew.fadosoft.com;

    client_max_body_size 1m;

    location / {
        limit_req zone=dew_rpc burst=20 nodelay;
        limit_req_status 429;

        # JSON-RPC is POST; allow OPTIONS for browser wallets
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://dew_rpc_backend;
    }
}

# --- Faucet SPA + API: https://faucet-dew.fadosoft.com ---
server {
    listen 80;
    listen [::]:80;
    server_name faucet-dew.fadosoft.com;

    client_max_body_size 1m;

