# Docker Compose edge nginx — public surface for *-dew.fadosoft.com
# Mounted by deploy/docker-compose.yml service "edge".
#
# Upstreams = Compose service names (internal network only).
# TLS material is always at /etc/nginx/ssl/{fullchain,privkey}.pem
# (synced from Let's Encrypt by deploy/nginx/docker-entrypoint-edge.sh).
#
# ACME HTTP-01: /.well-known/acme-challenge/ → /var/www/certbot

limit_req_zone $binary_remote_addr zone=dew_rpc:10m rate=10r/s;

upstream dew_rpc_backend {
    server dew-node:8545;
    keepalive 32;
}

upstream dew_faucet_backend {
    server faucet-frontend:80;
    keepalive 16;
}

upstream dew_explorer_backend {
    server explorer:80;
    keepalive 16;
}

# --- JSON-RPC: rpc-dew.fadosoft.com ---
server {
    listen 80;
    listen [::]:80;
    server_name rpc-dew.fadosoft.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rpc-dew.fadosoft.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    location / {
        limit_req zone=dew_rpc burst=20 nodelay;
        limit_req_status 429;

        limit_except POST OPTIONS {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://dew_rpc_backend;
    }
}

