# nginx site for controlled public Dew JSON-RPC (path B).
# Install:
#   sudo install -m 644 deploy/nginx/dew-rpc.conf /etc/nginx/sites-available/dew-rpc
#   sudo ln -sf /etc/nginx/sites-available/dew-rpc /etc/nginx/sites-enabled/dew-rpc
# Edit server_name, then: sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d rpc.example.com
#
# Dew must listen on 127.0.0.1:8545 only (see dew-rpc-public.service).

limit_req_zone $binary_remote_addr zone=dew_rpc:10m rate=10r/s;

upstream dew_rpc_backend {
    server 127.0.0.1:8545;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rpc.example.com;

    # After certbot, this block is usually redirected to HTTPS.
    client_max_body_size 1m;

    location / {
        limit_req zone=dew_rpc burst=20 nodelay;
        limit_req_status 429;

        # JSON-RPC is POST; allow OPTIONS for browser wallets
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_pass http://dew_rpc_backend;
    }
}

