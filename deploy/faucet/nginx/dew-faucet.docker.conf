server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 1m;

    # Serve built static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls directly to the Go faucet backend container
    # Handles CORS issues by matching domains on client browser calls
    location /api/ {
        # Rewrite /api/some-endpoint -> /some-endpoint
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://faucet-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
