# Dew Foundry example — chain ID 2205 (public-testnet-v1 / local devnet).
# https://book.getfoundry.sh/reference/config/overview

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Override with: forge script ... --rpc-url $DEW_RPC_URL
[rpc_endpoints]
dew_local = "http://127.0.0.1:8545"
dew = "https://rpc-dew.fadosoft.com"
