# Build and push multi-arch deploy images to GHCR on release.
# Triggered by:
#   - workflow_call (from release-please.yml when release_created)
#   - push tags v* (when tag is created with a PAT)
#   - workflow_dispatch (re-push for an existing tag)
# See docs/build/go-project-layout.md § Release.

name: Release images

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build images for (e.g. v0.2.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  publish-images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    # Path B captcha site key lives in GitHub Environment "testnet" (vars, not secrets).
    # Without this, environment-scoped PUBLIC_CAPTCHA_* are empty at bake time.
    environment: testnet
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Path B public genesis (faucet alloc only) — matches deploy/docker-compose.yml
          - image: dew
            dockerfile: deploy/node/Dockerfile
            build_args: |
              GENESIS_FILE=genesis.public.json
          - image: dew-faucet
            dockerfile: deploy/faucet/Dockerfile
            build_args: ""
          - image: dew-indexer
            dockerfile: deploy/indexer/Dockerfile
            build_args: ""
          # SPA PUBLIC_* bake path B hostnames (browser-facing; no secrets).
          # Captcha site key/provider are NOT listed here: environment-scoped
          # vars are empty inside strategy.matrix — inject at step level below.
          - image: dew-faucet-web
            dockerfile: deploy/faucet/Dockerfile.web
            build_args: |
              PUBLIC_FAUCET_API_URL=/api
              PUBLIC_EXPLORER_URL=https://explorer-dew.fadosoft.com
          - image: dew-explorer
            dockerfile: deploy/explorer/Dockerfile
            build_args: |
              PUBLIC_RPC_URL=https://rpc-dew.fadosoft.com
              PUBLIC_CHAIN_ID=2205
              PUBLIC_EXPLORER_BASE=https://explorer-dew.fadosoft.com
              PUBLIC_INDEXER_URL=https://explorer-dew.fadosoft.com/indexer
              PUBLIC_KNOWN_TOKENS=USDT:0x43d08b71B0A5626a9D0eB607C2aE5277255cFbC8,USDC:0xacDd0BF26C96879b4c4CeE8F92928f1760F07119,DAI:0x9813B1738eb2982F3D0C1E22F9C7c4F07B670a1B,WETH:0x5b88b2ab38920197328f9D90BaAf29cb91F7E3CB,WBTC:0xdB6E09cb954Ae645C815Bc941bDfD85D4144166E
          - image: dew-guestbook
            dockerfile: deploy/guestbook/Dockerfile
            build_args: |
              PUBLIC_RPC_URL=https://rpc-dew.fadosoft.com
              PUBLIC_GUESTBOOK=0x83bB4E539BE46503481E66094b01b854990BF84a
              PUBLIC_EXPLORER_URL=https://explorer-dew.fadosoft.com
              PUBLIC_CHAIN_ID=2205
    steps:
      - name: Resolve tag and registry
        id: meta
        run: |
          set -euo pipefail
          # workflow_call / workflow_dispatch pass inputs.tag; push tags use ref name.
          # (Reusable workflows keep the caller's event_name, so do not key on it.)
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like vX.Y.Z (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "owner=$OWNER"
            echo "image=ghcr.io/${OWNER}/${{ matrix.image }}"
          } >> "$GITHUB_OUTPUT"
          # latest only for non-prerelease (e.g. not 0.2.0-rc.1)
          if [[ "$VERSION" != *-* ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=${{ steps.meta.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_stable == 'true' }}

      # Environment-scoped vars only resolve in job steps (not strategy.matrix).
      # Without this, PUBLIC_CAPTCHA_* bake empty and the SPA shows
      # "PUBLIC_CAPTCHA_SITE_KEY missing" while /info mode is still captcha.
      - name: Resolve build-args
        id: build_args
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MATRIX_ARGS: ${{ matrix.build_args }}
          IMAGE: ${{ matrix.image }}
          PUBLIC_CAPTCHA_PROVIDER: ${{ vars.PUBLIC_CAPTCHA_PROVIDER }}
          PUBLIC_CAPTCHA_SITE_KEY: ${{ vars.PUBLIC_CAPTCHA_SITE_KEY }}
        run: |
          set -euo pipefail
          {
            echo "VERSION=${VERSION}"
            # matrix.build_args may be empty (dew-faucet) or multi-line
            if [ -n "${MATRIX_ARGS}" ]; then
              printf '%s\n' "${MATRIX_ARGS}"
            fi
            if [ "${IMAGE}" = "dew-faucet-web" ]; then
              if [ -z "${PUBLIC_CAPTCHA_SITE_KEY}" ]; then
                echo "::error::PUBLIC_CAPTCHA_SITE_KEY is empty. Set Environment variable on 'testnet' (Settings → Environments → testnet). Environment-scoped vars must be read in a job step, not strategy.matrix."
                exit 1
              fi
              echo "PUBLIC_CAPTCHA_PROVIDER=${PUBLIC_CAPTCHA_PROVIDER:-turnstile}"
              echo "PUBLIC_CAPTCHA_SITE_KEY=${PUBLIC_CAPTCHA_SITE_KEY}"
              echo "Baking captcha provider=${PUBLIC_CAPTCHA_PROVIDER:-turnstile} site_key_len=${#PUBLIC_CAPTCHA_SITE_KEY}"
            fi
          } > /tmp/docker-build-args.txt
          {
            echo "list<<EOF"
            cat /tmp/docker-build-args.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          # VERSION injects software semver into Go images (dew, dew-faucet, dew-indexer); SPA Dockerfiles ignore it.
          # Captcha PUBLIC_* for dew-faucet-web come from the step above (Environment testnet vars).
          build-args: ${{ steps.build_args.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

  publish-image-list:
    name: Attach image list to release
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "owner=$OWNER"
          } >> "$GITHUB_OUTPUT"

      - name: Write images.txt and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ steps.meta.outputs.owner }}
        run: |
          set -euo pipefail
          {
            echo "# Dew container images for ${TAG}"
            echo "# Registry: ghcr.io/${OWNER}"
            echo "# Platforms: linux/amd64, linux/arm64"
            echo "#"
            echo "# Node image bakes genesis.public.json (path B)."
            echo "# SPA images bake path B PUBLIC_* URLs (see release-images.yml)."
            echo
            for name in dew dew-faucet dew-faucet-web dew-explorer dew-guestbook dew-indexer; do
              echo "ghcr.io/${OWNER}/${name}:${VERSION}"
              echo "ghcr.io/${OWNER}/${name}:${TAG}"
            done
          } > images.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" images.txt --clobber
          else
            echo "No GitHub Release for $TAG yet — skipping asset upload (images are on GHCR)."
          fi
          cat images.txt
