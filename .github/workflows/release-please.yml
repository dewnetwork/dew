# Google Release Please: Conventional Commits → Release PR → tag + GitHub Release.
# On release_created: attach Go binaries + push multi-arch images to GHCR.
# See docs/build/go-project-layout.md § Release.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # Optional PAT (repo secret RELEASE_PLEASE_TOKEN) so the Release PR
          # triggers CI and the tag push can fire other workflows. Default
          # GITHUB_TOKEN still creates the Release PR + GitHub Release; binary
          # + GHCR publish run in this workflow via release_created.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-binaries:
    name: Publish Go binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: true

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="dist/dew_${TAG}_${GOOS}_${GOARCH}"
          mkdir -p "$out"
          ldflags="-s -w"
          go build -trimpath -ldflags="$ldflags" -o "$out/dew" ./cmd/dew
          go build -trimpath -ldflags="$ldflags" -o "$out/dewcli" ./cmd/dewcli
          go build -trimpath -ldflags="$ldflags" -o "$out/dewfaucet" ./cmd/dewfaucet
          tar -C "$out" -czf "${out}.tar.gz" dew dewcli dewfaucet
          rm -rf "$out"
          ls -la dist/

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          archive="dist/dew_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          gh release upload "$TAG" "$archive" --clobber

  publish-checksums:
    name: Publish checksums
    needs: [release-please, publish-binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets and write checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job — tell gh which repo (avoids "not a git repository").
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" -D dist -p 'dew_*.tar.gz'
          (
            cd dist
            sha256sum dew_*.tar.gz | tee checksums.txt
          )
          gh release upload "$TAG" dist/checksums.txt --clobber

  publish-images:
    name: Publish GHCR images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-images.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
      packages: write
    secrets: inherit
