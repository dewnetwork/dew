# Automated dependency updates for Go, Node workspaces, and Actions.
# Pairs with .github/workflows/security.yml (govulncheck / pnpm audit / CodeQL).

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript

  - package-ecosystem: npm
    directory: /explorer
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript

  - package-ecosystem: npm
    directory: /faucet-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
