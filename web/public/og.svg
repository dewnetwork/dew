<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070f1a"/>
      <stop offset="0.45" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#070f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 120) rotate(90) scale(420 520)">
      <stop stop-color="#3db8a8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3db8a8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 500) rotate(90) scale(360 400)">
      <stop stop-color="#5eead4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dew" x1="10" y1="6" x2="22" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="edge" x1="80" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#5eead4" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 126h1200M0 252h1200M0 378h1200M0 504h1200"/>
    <path d="M200 0v630M400 0v630M600 0v630M800 0v630M1000 0v630"/>
  </g>

  <!-- wordmark: logo (56) + gap 16 + word, vertically centered as a unit -->
  <!-- logo top=88, size=56 → center Y = 116 -->
  <!-- Exact logo.svg geometry — no stroke on full-bleed rect (half-stroke clips and looks double-edged). -->
  <svg x="80" y="88" width="56" height="56" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="8" fill="#0a1628"/>
    <path
      d="M16 6c-3.2 4.8-5.5 8.2-5.5 11.2a5.5 5.5 0 0 0 11 0C21.5 14.2 19.2 10.8 16 6z"
      fill="url(#dew)"
    />
    <circle cx="16" cy="17.5" r="2.2" fill="#0a1628" opacity="0.35"/>
  </svg>
  <text
    x="152"
    y="116"
    fill="#e8f4f1"
    font-family="system-ui,Segoe UI,sans-serif"
    font-size="32"
    font-weight="700"
    letter-spacing="-0.02em"
    dominant-baseline="central"
  >Dew</text>

  <rect x="80" y="172" width="96" height="3" rx="2" fill="url(#edge)"/>

  <text x="80" y="280" fill="#e8f4f1" font-family="system-ui,Segoe UI,sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">Ship Solidity.</text>
  <text x="80" y="352" fill="#5eead4" font-family="system-ui,Segoe UI,sans-serif" font-size="64" font-weight="800" letter-spacing="-0.03em">Settle in one block.</text>

  <text x="80" y="420" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="500">
    EVM L1 · Dew-BFT finality · public-testnet-v1 live
  </text>

  <!-- metric chips -->
  <g font-family="ui-monospace,SF Mono,monospace" font-size="15">
    <rect x="80" y="470" width="150" height="56" rx="12" fill="#122033" stroke="#5eead4" stroke-opacity="0.14"/>
    <text x="100" y="494" fill="#7a8fa3">BLOCK TIME</text>
    <text x="100" y="514" fill="#e8f4f1" font-size="18" font-weight="700">~1s</text>

    <rect x="246" y="470" width="160" height="56" rx="12" fill="#122033" stroke="#5eead4" stroke-opacity="0.14"/>
    <text x="266" y="494" fill="#7a8fa3">FINALITY</text>
    <text x="266" y="514" fill="#e8f4f1" font-size="18" font-weight="700">1 block</text>

    <rect x="422" y="470" width="150" height="56" rx="12" fill="#122033" stroke="#5eead4" stroke-opacity="0.14"/>
    <text x="442" y="494" fill="#7a8fa3">CHAIN ID</text>
    <text x="442" y="514" fill="#e8f4f1" font-size="18" font-weight="700">2205</text>
  </g>

  <text x="80" y="580" fill="#7a8fa3" font-family="ui-monospace,SF Mono,monospace" font-size="14">
    faucet · explorer · guestbook · eth_*
  </text>
</svg>
